version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ledger_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # ---------------------------------------------------------
  # The GCP Pub/Sub Emulator
  # ---------------------------------------------------------
  pubsub:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    command: gcloud beta emulators pubsub start --project=local-project --host-port=0.0.0.0:8085
    ports:
      - "8085:8085"

  # ---------------------------------------------------------
  # The Bootstrapper (Creates Topics & Subscriptions)
  # ---------------------------------------------------------
  pubsub-init:
    image: curlimages/curl
    depends_on:
      - pubsub
    # Waits 5 seconds for Pub/Sub to boot, then uses the REST API to create the Topic and Subscription
    command: >
      sh -c "
        sleep 5 &&
        echo 'Creating Topic...' &&
        curl -s -X PUT http://pubsub:8085/v1/projects/local-project/topics/payment-processing-topic &&
        echo 'Creating Subscription...' &&
        curl -s -X PUT http://pubsub:8085/v1/projects/local-project/subscriptions/ledger-worker-sub -H 'Content-Type: application/json' -d '{\"topic\":\"projects/local-project/topics/payment-processing-topic\"}' &&
        echo 'Pub/Sub Setup Complete!'
      "

  api:
    build: 
      context: ./api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/ledger_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PUBSUB_EMULATOR_HOST=pubsub:8085
      - PROJECT_ID=local-project
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./api:/app

  worker:
    build: 
      context: ./api
    command: python -m app.worker
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/ledger_db
      - PUBSUB_EMULATOR_HOST=pubsub:8085
      - PROJECT_ID=local-project
      - PYTHONUNBUFFERED=1
    depends_on:
      db:
        condition: service_healthy
      pubsub-init:
        condition: service_completed_successfully
    volumes:
      - ./api:/app